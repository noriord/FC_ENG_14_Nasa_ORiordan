
{% extends 'base.html' %}

{% block content %}
<h1 class="mb-4">✏️ Edit Expense</h1>

<div class="card mb-4">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Update Expense Details</h5>
    </div>
    <div class="card-body">
        <form action="/edit_expense/{{ expense.id }}" method="POST">
            <div class="row mb-3">
                <div class="col-md-3">
                    <label class="form-label">Event</label>
                    <select name="event_id" class="form-select" required>
                        {% for event in events %}
                        <option value="{{ event.id }}" {% if event.id == expense.event_id %}selected{% endif %}>
                            {{ event.name }} ({{ event.location }} - {{ event.date }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Description</label>
                    <input type="text" name="description" class="form-control" value="{{ expense.description }}" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Currency</label>
                    <select name="currency" class="form-select">
                        <option value="EUR" {% if expense.original_currency == 'EUR' %}selected{% endif %}>€ Euro</option>
                        <option value="GBP" {% if expense.original_currency == 'GBP' %}selected{% endif %}>£ Pound</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Amount</label>
                    <input type="text" name="amount" class="form-control" value="{{ expense.original_amount }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Category</label>
                    <select name="category" class="form-select">
                        {% for category in categories %}
                        <option value="{{ category.name }}" {% if category.name == expense.category %}selected{% endif %}>{{ category.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <small class="text-muted">💡 Current rate: £1 = €{{ exchange_rate.gbp_to_eur }}</small>
            <br><br>
            <button type="submit" class="btn btn-primary">💾 Save Changes</button>
            <a href="/" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
